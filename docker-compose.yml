services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auib_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - auib-monitor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auib_monitor']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auib-monitor-postgres:
